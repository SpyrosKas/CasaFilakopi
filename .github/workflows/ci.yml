name: CI

on:
  push:
    branches: [master, dev-booking]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: pnpm test:db
      - name: Generated types match the schema
        run: |
          pnpm db:types
          git diff --exit-code lib/db/types.ts
      - name: Write local environment
        run: |
          supabase status -o env > .supabase-env
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            grep '^API_URL=' .supabase-env | sed 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/' | tr -d '"'
            grep '^PUBLISHABLE_KEY=' .supabase-env | sed 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/' | tr -d '"'
            grep '^SECRET_KEY=' .supabase-env | sed 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/' | tr -d '"'
          } > .env.local
          rm .supabase-env
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:static
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 3
