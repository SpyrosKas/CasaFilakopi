name: CI

on:
  push:
    branches: [master, dev-booking, integration]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: pnpm test:db
      - name: Generated types match the schema
        run: |
          pnpm db:types
          git diff --exit-code lib/db/types.ts
      - name: Write local environment
        run: |
          supabase status -o env > .supabase-env
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            grep '^API_URL=' .supabase-env | sed 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/' | tr -d '"'
            grep '^PUBLISHABLE_KEY=' .supabase-env | sed 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/' | tr -d '"'
            grep '^SECRET_KEY=' .supabase-env | sed 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/' | tr -d '"'
          } > .env.local
          rm .supabase-env
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:static
      - run: pnpm test:pay
      - run: pnpm test:prod
      # QA-07: a production-style build, scored by Lighthouse. Accessibility,
      # best practices and SEO must reach 90; performance only warns, because
      # a shared runner's speed varies from run to run.
      - name: Lighthouse
        env:
          PORT: "3011"
          NEXT_PUBLIC_SITE_URL: http://localhost:3011
          NEXT_PUBLIC_INDEXABLE: "true"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
        run: |
          pnpm build
          pnpm exec next start -p 3011 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3011/en && break; sleep 2; done
          pnpm lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 3
